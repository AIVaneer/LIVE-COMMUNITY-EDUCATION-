<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Courier New', Courier, monospace;
            color: white;
        }
        h1 {
            margin-bottom: 5px;
            text-shadow: 0 0 10px #0ff;
        }
        #score {
            font-size: 24px;
            margin-bottom: 10px;
        }
        canvas {
            border: 4px solid #0ff;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            background: #111;
            touch-action: none;
        }
        .controls {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            opacity: 0.8;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background: #0ff;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #fff; }

        /* On-screen directional buttons */
        .dpad {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 8px;
        }
        .dpad button {
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 24px;
            border: 2px solid #0ff;
            border-radius: 12px;
        }
        .dpad button:active {
            background: #0ff;
            color: #000;
            transform: scale(0.95);
        }
        .empty { visibility: hidden; }

        .sound-toggle {
            margin-top: 10px;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px 50px;
            border-radius: 12px;
            text-align: center;
            border: 3px solid #f00;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <h1>🐍 SNAKE</h1>
    <div id="score">Score: <span id="scoreValue">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        Arrow Keys / WASD • Or use buttons below
    </div>

    <!-- Directional Pad -->
    <div class="dpad">
        <div class="empty"></div>
        <button id="up">↑</button>
        <div class="empty"></div>
        
        <button id="left">←</button>
        <div class="empty"></div>
        <button id="right">→</button>
        
        <div class="empty"></div>
        <button id="down">↓</button>
        <div class="empty"></div>
    </div>

    <div class="sound-toggle">
        <button id="soundBtn">🔊 Sound ON</button>
    </div>

    <button onclick="restartGame()" style="margin-top:15px;">New Game</button>

    <div id="gameOverScreen" class="game-over">
        <h2>GAME OVER</h2>
        <p>Your score: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreValue');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreElement = document.getElementById('finalScore');
        const soundBtn = document.getElementById('soundBtn');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {};
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let gameSpeed = 100;
        let soundEnabled = true;

        // Web Audio API for simple sounds
        let audioContext;
        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                console.log("Audio not supported");
            }
        }

        function playTone(frequency, duration, type = 'sine', volume = 0.3) {
            if (!soundEnabled || !audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            gain.gain.value = volume;
            
            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            
            oscillator.start();
            setTimeout(() => {
                oscillator.stop();
            }, duration);
        }

        function eatSound() {
            playTone(800, 80, 'square', 0.4);
            setTimeout(() => playTone(1200, 120, 'square', 0.3), 50);
        }

        function gameOverSound() {
            playTone(400, 300, 'sawtooth', 0.5);
            setTimeout(() => playTone(200, 400, 'sawtooth', 0.4), 150);
        }

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    return randomFood();
                }
            }
        }

        function drawGame() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Collisions
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                eatSound();
                randomFood();

                if (score % 50 === 0 && gameSpeed > 50) {
                    clearInterval(gameInterval);
                    gameSpeed -= 10;
                    gameInterval = setInterval(drawGame, gameSpeed);
                }
            } else {
                snake.pop();
            }

            // Draw everything
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Snake
            snake.forEach((segment, i) => {
                ctx.fillStyle = i === 0 ? '#0f0' : '#0c0';
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Food
            ctx.fillStyle = '#f00';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function gameOver() {
            clearInterval(gameInterval);
            gameOverSound();
            finalScoreElement.textContent = score;
            gameOverScreen.style.display = 'block';
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameSpeed = 100;
            gameOverScreen.style.display = 'none';
            randomFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(drawGame, gameSpeed);
        }

        function restartGame() {
            startGame();
        }

        // Keyboard controls
        document.addEventListener('keydown', e => {
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W':
                    if (dy !== 1) { dx = 0; dy = -1; } break;
                case 'ArrowDown': case 's': case 'S':
                    if (dy !== -1) { dx = 0; dy = 1; } break;
                case 'ArrowLeft': case 'a': case 'A':
                    if (dx !== 1) { dx = -1; dy = 0; } break;
                case 'ArrowRight': case 'd': case 'D':
                    if (dx !== -1) { dx = 1; dy = 0; } break;
            }
        });

        // On-screen button controls
        document.getElementById('up').addEventListener('click', () => {
            if (dy !== 1) { dx = 0; dy = -1; }
        });
        document.getElementById('down').addEventListener('click', () => {
            if (dy !== -1) { dx = 0; dy = 1; }
        });
        document.getElementById('left').addEventListener('click', () => {
            if (dx !== 1) { dx = -1; dy = 0; }
        });
        document.getElementById('right').addEventListener('click', () => {
            if (dx !== -1) { dx = 1; dy = 0; }
        });

        // Sound toggle
        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊 Sound ON' : '🔇 Sound OFF';
        });

        // Touch swipe support (kept from before)
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });
        canvas.addEventListener('touchend', e => {
            const deltaX = e.changedTouches[0].screenX - touchStartX;
            const deltaY = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 30 && dx !== -1) { dx = 1; dy = 0; }
                else if (deltaX < -30 && dx !== 1) { dx = -1; dy = 0; }
            } else {
                if (deltaY > 30 && dy !== -1) { dx = 0; dy = 1; }
                else if (deltaY < -30 && dy !== 1) { dx = 0; dy = -1; }
            }
        });

        // Initialize
        initAudio();
        startGame();
    </script>
</body>
</html>
