<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Stars Game</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #3b42f3);
      color: white;
      overflow: hidden;
      height: 100vh;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #0c1224;
      border: 2px solid #38bdf8;
    }
    
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      background: rgba(0,0,0,0.8);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    #gameOver p {
      margin: 10px 0;
    }

    .restart-button {
      background: #38bdf8;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      cursor: pointer;
      border: none;
      outline: none;
    }

    .restart-button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="600" height="400"></canvas>
  <div id="gameOver">
    <p>Game Over! Your score: <span id="finalScore">0</span></p>
    <button class="restart-button" onclick="restartGame()">Restart Game</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 270, y: 350, width: 50, height: 10 };
    let stars = [];
    let score = 0;
    let lives = 3;
    let gameRunning = true;

    function createStar() {
      const size = 10;
      const x = Math.random() * (canvas.width - size);
      stars.push({ x: x, y: 0, size: size });
    }

    function drawPlayer() {
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function drawStars() {
      ctx.fillStyle = "#facc15";
      stars.forEach(star => {
        ctx.fillRect(star.x, star.y, star.size, star.size);
      });
    }

    function moveStars() {
      stars.forEach(star => {
        star.y += 3;
      });
    }

    function detectCollision() {
      stars = stars.filter(star => {
        if (
          star.y + star.size >= player.y &&
          star.x + star.size >= player.x &&
          star.x <= player.x + player.width
        ) {
          score++;
          return false; // Remove star
        } else if (star.y > canvas.height) {
          lives--;
          return false; // Remove star
        }
        return true;
      });
    }

    function endGame() {
      gameRunning = false;
      document.getElementById("gameOver").style.display = "block";
      document.getElementById("finalScore").textContent = score;
    }

    function update() {
      if (!gameRunning) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawPlayer();
      drawStars();
      moveStars();
      detectCollision();

      ctx.fillStyle = "white";
      ctx.font = "16px Arial";
      ctx.fillText(`Score: ${score}`, 10, 20);
      ctx.fillText(`Lives: ${lives}`, 10, 40);

      if (lives <= 0) {
        endGame();
      } else {
        requestAnimationFrame(update);
      }
    }

    function restartGame() {
      stars = [];
      score = 0;
      lives = 3;
      gameRunning = true;
      document.getElementById("gameOver").style.display = "none";
      update();
    }

    window.addEventListener("mousemove", event => {
      const rect = canvas.getBoundingClientRect();
      player.x = event.clientX - rect.left - player.width / 2;
    });

    setInterval(() => {
      if (gameRunning) createStar();
    }, 900);

    update();
  </script>
</body>
</html>
